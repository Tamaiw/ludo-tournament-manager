{{ define "title" }}Reset password — Ludo Tournament Manager{{ end }}
{{ define "content" }}
<h1>Set a new password</h1>
{{ if .Error }}<div class="flash error">{{ .Error }}</div>{{ end }}
<form method="POST" action="/password-resets/{{ .Token }}">
  {{ .CSRFField }}
  <label>New password <input type="password" name="password" required minlength="8"></label>
  <label>Confirm <input type="password" name="confirm" required minlength="8"></label>
  <button class="button">Update password</button>
</form>
{{ end }}
