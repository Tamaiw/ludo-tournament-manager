{{ define "title" }}Change password — Ludo Tournament Manager{{ end }}
{{ define "content" }}
<h1>Change password</h1>
{{ if .Error }}<div class="flash error">{{ .Error }}</div>{{ end }}
<form method="POST" action="/change-password">
  {{ .CSRFField }}
  <label>Current password <input type="password" name="current_password" required></label>
  <label>New password <input type="password" name="new_password" required minlength="8"></label>
  <label>Confirm <input type="password" name="confirm_password" required minlength="8"></label>
  <button class="button">Change password</button>
</form>
{{ end }}
