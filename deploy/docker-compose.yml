# Production docker-compose. Brings up the app + Caddy reverse-proxy.
#
# First-run flow:
#   1. cp .env.example .env && $EDITOR .env
#   2. docker compose -f deploy/docker-compose.yml run --rm --build seed \
#        --email manager@example.com --password 'correct horse battery staple'
#   3. docker compose -f deploy/docker-compose.yml up -d --build
#
# Update flow:
#   git pull && docker compose -f deploy/docker-compose.yml up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ludo-tournament-manager:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
      - DB_PATH=/data/ludo.db
    volumes:
      - ../data:/data
    depends_on: []
    networks: [ludo]
    # Container shares the image with the seed service. Caddy talks to it on
    # 8080 via the ludo network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ludo]
    depends_on:
      - app

  seed:
    image: ludo-tournament-manager:latest
    profiles: [seed]
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
      - DB_PATH=/data/ludo.db
    volumes:
      - ../data:/data
    entrypoint: ["/app/seed"]
    networks: [ludo]

networks:
  ludo:

volumes:
  caddy_data:
  caddy_config: